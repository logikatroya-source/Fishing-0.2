
name: Build GamePilot Fishing Windows EXE

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Install Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller pytest

      - name: Run tests
        run: python -m pytest tests -q

      - name: Build Windows EXE
        run: |
          python -m PyInstaller --noconfirm --clean --onefile --windowed --name GamePilotFishing main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: GamePilotFishing-Windows
          path: dist/GamePilotFishing.exe
          if-no-files-found: error
